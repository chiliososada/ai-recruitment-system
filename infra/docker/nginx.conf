# ---------------------------------------------------------------------------
# nginx server block for the @ars/web SPA (static).
#
# Serves the hashed Vite bundle with SPA history fallback, gzip, aggressive
# caching for fingerprinted assets, no-cache for index.html, and a strict but
# SPA-compatible set of security headers including a Content-Security-Policy.
#
# IMPORTANT — API origin is configurable:
#   The CSP `connect-src` must list the API origin the SPA calls (same value as
#   the build-time VITE_API_BASE_URL). Replace `https://api.example.com` below
#   with your real API origin per environment, or template it at deploy time
#   (e.g. envsubst into this file, or use nginx:alpine's /etc/nginx/templates).
#   `connect-src 'self'` alone is NOT enough when the API is a different origin.
# ---------------------------------------------------------------------------

server {
    # Non-privileged port so the container can run as a non-root user.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ----- Compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ----- Security headers (apply to every response) -----------------------
    # SPA-compatible CSP: only same-origin scripts (no inline JS), styles allow
    # 'unsafe-inline' because many CSS-in-JS / Vite style injections need it,
    # images allow data: URIs (inlined icons), connect-src allows the API origin.
    # Replace https://api.example.com with the real API origin (see header note).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.example.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Lock down powerful browser features the SPA does not use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ----- Hashed assets: long-lived, immutable cache -----------------------
    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static files with extensions (favicon, robots, manifest, etc.).
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|woff2?|ttf|eot|json|txt|map)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ----- index.html: never cache (so new deploys are picked up immediately) -
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # ----- SPA history fallback ---------------------------------------------
    # Unknown routes resolve to index.html so client-side routing works on reload
    # / deep links. Real files (handled above) are served directly.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Do not leak the nginx version.
    server_tokens off;
}
