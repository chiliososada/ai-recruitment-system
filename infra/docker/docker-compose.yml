# ---------------------------------------------------------------------------
# Local "supabase"-style stack — a real Postgres with pgvector for exercising the
# `ARS_RUNTIME=supabase` code path against an actual database.
#
#   docker compose -f infra/docker/docker-compose.yml up postgres   # DB only
#   docker compose -f infra/docker/docker-compose.yml --profile apps up --build
#
# NOTE: the DEFAULT runtime (`ARS_RUNTIME=local`) needs NO services at all — it runs
# an in-process PGlite Postgres (with pgvector) and deterministic mocks, with zero
# external credentials. Use this compose file only when you want a real Postgres
# (or to smoke-test the built api/web images together).
#
# The `api` and `web` services are gated behind the `apps` profile so `up postgres`
# brings up only the database. Both read configuration from an env file (default
# `.env` in this directory) — copy the repo-root `.env.example` and set
# ARS_RUNTIME=supabase, DATABASE_URL, secrets, and provider keys before enabling.
# Build context is the repository root (`../..`).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-54322}:5432'
    volumes:
      - ars_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ars-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sensible defaults for talking to the postgres service above; override in .env.
      NODE_ENV: ${NODE_ENV:-production}
      ARS_RUNTIME: ${ARS_RUNTIME:-supabase}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked in at build time; must point at the API origin the browser reaches.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-ja}
    image: ars-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  ars_pgdata:
