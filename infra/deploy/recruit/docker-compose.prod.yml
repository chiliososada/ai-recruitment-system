# ---------------------------------------------------------------------------
# recruit.toyousoft.co.jp — production stack (self-hosted Supabase on HPE).
#
# Layout (all ports bound to 127.0.0.1; the host Kong gateway publishes 443):
#   web      127.0.0.1:56300  nginx SPA          <- Kong route "/"
#   api      127.0.0.1:56301  Fastify API        <- Kong route "/api/"
#   db       127.0.0.1:56310  supabase/postgres (pgvector, auth/storage schemas)
#   auth     (internal) GoTrue
#   rest     (internal) PostgREST (required by storage-api)
#   storage  (internal) Supabase Storage (file backend)
#   sbgw     (internal) nginx exposing /auth/v1 + /storage/v1 as SUPABASE_URL
#   clamav   (internal) clamd virus scanner (required in production)
#
# Usage: see deploy.sh. Secrets live in .env (generate with gen-keys.py).
# ---------------------------------------------------------------------------

name: recruit

services:
  db:
    image: supabase/postgres:15.8.1.085
    container_name: recruit-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - recruit-db-data:/var/lib/postgresql/data
      - ./db-init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - '127.0.0.1:56310:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.158.1
    container_name: recruit-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: https://recruit.toyousoft.co.jp
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://recruit.toyousoft.co.jp
      GOTRUE_URI_ALLOW_LIST: https://recruit.toyousoft.co.jp,https://www.recruit.toyousoft.co.jp
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # No SMTP wired yet: confirm accounts at signup (swap to real SMTP later).
      GOTRUE_MAILER_AUTOCONFIRM: 'true'

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: recruit-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  storage:
    image: supabase/storage-api:v1.11.13
    container_name: recruit-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - recruit-storage-data:/var/lib/storage

  # Single internal origin exposing GoTrue + Storage the way the app expects
  # (SUPABASE_URL + /auth/v1/... and /storage/v1/...).
  sbgw:
    image: nginx:1.27-alpine
    container_name: recruit-sbgw
    restart: unless-stopped
    depends_on:
      - auth
      - storage
    volumes:
      - ./sb-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  clamav:
    image: clamav/clamav:1.4
    container_name: recruit-clamav
    restart: unless-stopped
    volumes:
      - recruit-clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  api:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.api
    image: recruit-api
    container_name: recruit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sbgw:
        condition: service_started
    environment:
      NODE_ENV: production
      ARS_RUNTIME: supabase
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      WEB_ORIGIN: https://recruit.toyousoft.co.jp,https://www.recruit.toyousoft.co.jp
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: http://sbgw:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_STORAGE_BUCKET: resumes
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VIRUS_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      LOG_LEVEL: info
      METRICS_PROVIDER: noop
      RATE_LIMIT_MAX: '300'
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - '127.0.0.1:56301:4000'

  web:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Empty base -> browser calls same-origin /api/... (Kong routes it to api).
        VITE_API_BASE_URL: ''
        VITE_DEFAULT_LOCALE: ja
    image: recruit-web
    container_name: recruit-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:56300:8080'

volumes:
  recruit-db-data:
  recruit-storage-data:
  recruit-clamav-db:
